[project]
name = "cloudintel-backend"
version = "0.1.0"
description = "CloudIntel OSINT aggregation API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "dnspython>=2.7",
    "python-whois>=0.9.5",
    "mangum>=0.19",
    "boto3>=1.35",
    "python-jose[cryptography]>=3.3",
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "respx>=0.21",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ASYNC"]
# B008: FastAPI's Depends() in defaults is the framework's intended idiom.
# UP042: str+Enum is deliberate — it keeps enum values JSON-serialisable on Python 3.11.
ignore = ["S101", "B008", "UP042"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

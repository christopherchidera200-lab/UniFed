# PostgreSQL (primary). Mirrors db/schema/adun_academic_model.sql.
# Connection string via ENV (Twelve-Factor); never hardcode credentials.
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  port: 5432

development:
  <<: *default
  database: unifed_dev
  host: <%= ENV.fetch("DATABASE_HOST", "localhost") %>
  username: <%= ENV.fetch("DATABASE_USER", "unifed") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "unifed") %>

test:
  <<: *default
  database: unifed_test
  host: <%= ENV.fetch("DATABASE_HOST", "localhost") %>
  username: <%= ENV.fetch("DATABASE_USER", "unifed") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "unifed") %>

production:
  <<: *default
  # 12-factor: prefer DATABASE_URL; fall back to component ENV vars so the
  # config is always valid (nil would crash db:test:prepare / db:create).
  url: <%= ENV["DATABASE_URL"].presence || "postgres://#{ENV.fetch('DATABASE_USER','unifed')}:***@#{ENV.fetch('DATABASE_HOST','localhost')}:5432/#{ENV.fetch('DATABASE_NAME','unifed')}" %>
  # TLS on by default for managed/cloud Postgres; OFF for Coolify's internal
  # Postgres (private network, no TLS). Drive via DATABASE_SSL=true|false.
  ssl: <%= ENV["DATABASE_SSL"] == "true" %>

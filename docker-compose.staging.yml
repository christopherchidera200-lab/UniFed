# UniFed Nigeria — staging deploy (Coolify), using pre-built Docker Hub images
# instead of building from source on the server (avoids OOM on small instances).
# Usage on Coolify: point the app at this file instead of docker-compose.yml.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: unifed
      POSTGRES_PASSWORD: unifed
      POSTGRES_DB: unifed
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unifed"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    image: chidera29/unifed-backend:latest
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      RAILS_ENV: production
      RACK_ENV: production
      DATABASE_HOST: postgres
      DATABASE_USER: unifed
      DATABASE_PASSWORD: unifed
      DATABASE_NAME: unifed
      DATABASE_URL: postgres://unifed:unifed@postgres:5432/unifed
      DATABASE_SSL: "false"
      REDIS_URL: redis://redis:6379/0
      RAILS_MAX_THREADS: "5"
      OIDC_JWKS_PRIVATE: ${OIDC_JWKS_PRIVATE:-ci-insecure-not-for-prod}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-change-me-in-prod}
      RAILS_FORCE_SSL: "false"
      NODE_SLUG: ${NODE_SLUG:-adun-staging}
      NODE_UNIVERSITY_ID: ${NODE_UNIVERSITY_ID:-b697c531-4995-4f9b-a324-3a3c82c9caa1}
      OIDC_ISSUER: ${OIDC_ISSUER:-https://api-staging.unifed.ng}
      OIDC_KID: ${OIDC_KID:-unifed-staging-1}
      FEDERATION_ENABLED: ${FEDERATION_ENABLED:-true}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-120}
      SECURE_HEADERS_HSTS: ${SECURE_HEADERS_HSTS:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3001}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/v1/healthz || exit 1"]
      interval: 10s
      timeout: 4s
      retries: 12
  frontend:
    image: chidera29/unifed-frontend:latest
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:3000}
    ports:
      - "3001:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000 || exit 1"]
      interval: 10s
      timeout: 4s
      retries: 12
volumes:
  pgdata:

# UniFed local development stack
# Spins up Postgres, Redis, OpenSearch, MinIO (S3 stand-in) + the Rails API.
# Usage: docker compose -f infra/docker/docker-compose.yml up
services:
  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_USER: unifed
      POSTGRES_PASSWORD: unifed
      POSTGRES_DB: unifed_dev
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unifed"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.1-alpine
    command: ["redis-server", "--requirepass", "unifed"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "--pass", "unifed", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  opensearch:
    image: opensearchproject/opensearch:2.15.0
    environment:
      discovery.type: single-node
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: "Un1Fed!Os2026"
      plugins.security.disabled: "true"
    ports: ["9200:9200"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: unifed
      MINIO_ROOT_PASSWORD: "Un1Fed!Mm2026"
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - miniodata:/data

  backend:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.rails
    command: ["bundle","exec","rails","server","-b","0.0.0.0","-p","3000"]
    environment:
      RAILS_ENV: development
      DATABASE_URL: "postgres://unifed:unifed@postgres:5432/unifed_dev"
      REDIS_URL: "redis://:unifed@redis:6379/0"
      OPENSEARCH_URL: "http://opensearch:9200"
      MINIO_URL: "http://minio:9000"
      MINIO_ACCESS_KEY: unifed
      MINIO_SECRET_KEY: "Un1Fed!Mm2026"
    ports: ["3000:3000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      opensearch: { condition: service_healthy }
    volumes:
      - ../..:/app

volumes:
  pgdata:
  miniodata:

apiVersion: apps/v1
kind: Deployment
metadata:
  name: unifed-backend
  namespace: unifed
  labels:
    app: unifed-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: unifed-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: unifed-backend
    spec:
      containers:
        - name: backend
          image: "123456789012.dkr.ecr.af-south-1.amazonaws.com/unifed-backend:latest"
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: unifed-backend
            - secretRef:
                name: unifed-backend
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: unifed-backend
  namespace: unifed
spec:
  type: ClusterIP
  selector:
    app: unifed-backend
  ports:
    - port: 80
      targetPort: 3000

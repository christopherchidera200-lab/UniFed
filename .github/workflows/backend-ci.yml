name: backend-ci

on:
  push:
    branches: [master, main]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**"]
  workflow_dispatch:

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: test
      PGUSER: postgres
      PGPASSWORD: postgres
      DATABASE_URL: postgres://localhost:5432/unifed_test
      REDIS_URL: redis://localhost:6379/0
      OIDC_JWKS_PRIVATE: ci-strong-test-secret-please-rotate-do-not-use-in-prod-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      # Dedicated HS256 secret for internal API tokens (vuln-0004). Distinct from
      # OIDC_JWKS_PRIVATE so the published RS256 public key can't forge tokens.
      TOKEN_SERVICE_SECRET: ci-strong-test-hmac-secret-please-rotate-do-not-use-in-prod-bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL and Redis (native, no Docker service)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-contrib redis-server
          sudo systemctl start postgresql
          sudo systemctl start redis-server
          sudo -u postgres psql -c "CREATE USER unifed WITH PASSWORD 'unifed' CREATEDB SUPERUSER;" || true
          sudo -u postgres psql -c "CREATE DATABASE unifed_test OWNER unifed;" || true

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Bundle install (generates Gemfile.lock)
        run: bundle install --jobs 4

      - name: Load schema (psql, deterministic - no rails needed)
        run: |
          for f in ../db/schema/*.sql; do
            echo "== loading $f =="
            sudo -u postgres psql -d unifed_test -v ON_ERROR_STOP=1 -f "$f" || true
          done

      - name: RuboCop
        run: bundle exec rubocop -f github || true

      - name: RSpec
        run: bundle exec rspec --format progress

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: backend/coverage

  security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Bundler audit
        run: |
          gem install bundler-audit
          bundle audit --update || true
      - name: Brakeman
        run: |
          gem install brakeman
          brakeman -f plain || true

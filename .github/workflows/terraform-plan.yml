name: terraform-plan

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths: ["infra/terraform/**", ".github/workflows/terraform-plan.yml"]
  pull_request:
    paths: ["infra/terraform/**"]

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.2"
      # Local backend (ci.tfbackend) needs no cloud creds, so init/fmt/validate
      # run in CI without AWS. `terraform plan` requires real AWS credentials
      # and is run from a developer machine / a privileged deployment job.
      - run: terraform init -backend-config=ci.tfbackend
      - run: terraform fmt -check
      - run: terraform validate

name: frontend-ci

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths: ["frontend/**", ".github/workflows/frontend-ci.yml"]
  pull_request:
    paths: ["frontend/**"]

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_BASE: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Playwright browsers (chromium) for the E2E smoke test.
      - run: npx playwright install --with-deps chromium
      # Build + serve the mock-API E2E (tests use page.route, no live backend).
      - run: npm run build
      - run: npm run start &
      - name: Wait for server
        run: npx wait-on http://localhost:3000 || (sleep 5 && npx wait-on http://localhost:3000)
      - run: npm run e2e
